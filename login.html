<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tripsero</title>
    <link rel="stylesheet" href="global.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Identity Services script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            background-color: var(--bg-light);
            margin: 0;
            font-family: var(--font-main);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: var(--text-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .logo-icon {
            font-size: 48px;
            color: var(--primary-green);
            margin-bottom: 16px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin: 0 0 32px 0;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            min-height: 44px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider:not(:empty)::before {
            margin-right: .25em;
        }

        .divider:not(:empty)::after {
            margin-left: .25em;
        }

        .back-link {
            color: var(--text-light);
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-dark);
        }

        #loginSuccessMessage {
            display: none;
            background-color: rgba(34, 229, 92, 0.1);
            color: #1a9e40;
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(34, 229, 92, 0.2);
        }
        
        .setup-warning {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            margin-top: 24px;
            text-align: left;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
        <h1 class="title">Welcome Back</h1>
        <p class="subtitle">Sign in to plan your next adventure.</p>

        <!-- Success Message Placeholder -->
        <div id="loginSuccessMessage">
            <i class="fa-solid fa-check-circle" style="margin-right: 4px;"></i> Logged in successfully! Redirecting...
        </div>

        <!-- Google Sign-In Container -->
        <div class="google-btn-container" id="googleButtonContainer">
            <!-- This container maps to the data-callback function below -->
            <div id="g_id_onload"
                 data-client_id="971957301352-a6mqrr5t26pbuvghjv7c7jg1tg7o3cl9.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>

        <div class="divider">or continue as guest</div>

        <a href="HP/index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Homepage
        </a>
        
        <div class="setup-warning">
            <strong>Note for Developer:</strong> Ensure <strong>http://localhost:3000</strong> is authorized in the Google Cloud Console for the 'Tripsero' project.
        </div>
    </div>

    <script>
        // Handle the response from Google Identity Services
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token received: " + response.credential);
            
            // Decode the JWT token to extract fundamental user details solely for frontend demo purposes
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            
            const userPayload = JSON.parse(jsonPayload);
            console.log("Welcome, " + userPayload.name);
            
            // Store user in localStorage (simulate login state)
            localStorage.setItem('tripseroUser', JSON.stringify({
                name: userPayload.name,
                email: userPayload.email,
                picture: userPayload.picture
            }));

            // Hide the login buttons and show success message
            document.getElementById('googleButtonContainer').style.display = 'none';
            document.getElementById('loginSuccessMessage').style.display = 'block';

            // Simulate redirect to the application home
            setTimeout(() => {
                window.location.href = 'HP/index.html';
            }, 1500);
        }
    </script>
</body>
</html>
